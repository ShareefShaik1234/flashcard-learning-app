<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFlash - Manage Flashcards</title>
  <meta name="description" content="Add, edit, delete, search, and categorize your flashcards library.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <main>
      <!-- Page Header -->
      <header class="mb-3" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 class="gradient-text" style="font-size: 2.5rem; font-weight: 800;">Flashcard Library</h1>
          <p style="color: var(--text-muted);">Manage your questions, answers, and tags in one central vault.</p>
        </div>
        <button class="btn btn-primary" id="btn-add-card">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right: 4px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Add Flashcard
        </button>
      </header>

      <!-- Action & Filtering Bar -->
      <section class="glass-panel action-bar" style="padding: 16px; border-radius: 16px;">
        <div class="search-wrapper">
          <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" class="input-field" id="search-input" placeholder="Search cards by question or answer...">
        </div>
        
        <div class="filter-wrapper">
          <select class="input-field" id="category-filter">
            <option value="all">All Categories</option>
            <!-- Dynamically populated -->
          </select>
        </div>
      </section>

      <!-- Flashcard Grid Container -->
      <section class="cards-grid mb-3" id="cards-grid-container">
        <!-- Dynamically populated -->
      </section>

      <!-- Unified Add/Edit Card Modal -->
      <div class="modal-overlay" id="card-modal-overlay">
        <div class="glass-panel modal-container">
          <div class="modal-header">
            <h3 id="modal-title">Create New Flashcard</h3>
            <button class="close-btn" id="modal-close">&times;</button>
          </div>
          <form id="card-form">
            <div class="modal-body">
              <!-- Question Input -->
              <div class="form-group">
                <label for="card-question">Question</label>
                <textarea class="input-field" id="card-question" placeholder="Enter study question..." required></textarea>
              </div>
              <!-- Answer Input -->
              <div class="form-group">
                <label for="card-answer">Answer</label>
                <textarea class="input-field" id="card-answer" placeholder="Enter answer or explanation..." required></textarea>
              </div>
              <!-- Category Input -->
              <div class="form-group">
                <label for="card-category">Category</label>
                <input type="text" class="input-field" id="card-category" list="category-suggestions" placeholder="e.g., Algorithms, Web Dev, OS" required>
                <datalist id="category-suggestions">
                  <!-- Suggestions loaded dynamically -->
                </datalist>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-glass" id="btn-modal-cancel">Cancel</button>
              <button type="submit" class="btn btn-primary" id="btn-modal-submit">Save Card</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/flashcards.js"></script>
</body>
</html>
